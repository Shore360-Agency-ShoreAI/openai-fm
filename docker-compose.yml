services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_URL=postgres://nextjs:password@db:5432/openai_fm?sslmode=disable
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=nextjs
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=openai_fm
    ports:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextjs -d openai_fm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
